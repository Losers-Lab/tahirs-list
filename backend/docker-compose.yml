# Local development services for the Tahir's List backend.
#
#   docker compose up -d
#
# Brings up:
#   - Postgres 17 + PostGIS 3.4  (the persistence adapter's database)
#   - MinIO S3-compatible storage (private buckets; presigned access from the app)
#
# The Ktor app runs in a container too: `./scripts/backend-live.sh` (or
# `./scripts/backend-test.sh` for the build/test container) connects to these
# services over the compose network / localhost.
name: tahirs-list

services:
  postgis:
    image: postgis/postgis:17-3.4
    container_name: tahirs-list-postgis
    environment:
      POSTGRES_DB: halal
      POSTGRES_USER: halal
      POSTGRES_PASSWORD: halal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halal -d halal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Image note: minio/minio and minio/mc were deleted from Docker Hub (Sep 2026) and
  # quay.io/minio now rejects anonymous pulls, so the pinned upstream tags no longer
  # resolve on a fresh machine. pgsty/silo is an actively maintained MinIO-compatible
  # fork that ships the same server *and* the `mc` client in one image.
  minio:
    image: pgsty/silo:latest
    container_name: tahirs-list-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Prove MinIO is reachable and scaffold the private bucket the app writes to.
  # Retries internally so it is not coupled to the server healthcheck; the
  # dependency just needs the minio container to be started.
  minio-init:
    image: pgsty/silo:latest
    container_name: tahirs-list-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c", "until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio'; sleep 2; done; until mc ready local; do echo 'waiting for minio'; sleep 2; done; mc mb --ignore-existing local/halal; echo 'MinIO bucket halal ready'"]

volumes:
  pgdata:
  miniodata: