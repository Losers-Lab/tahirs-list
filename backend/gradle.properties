org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# Keep the containerized build small: 9 tiny modules do not need all host cores.
org.gradle.workers.max=2
org.gradle.configuration-cache=true
kotlin.code.style=official
# Container builds run Gradle with --no-daemon; an in-process Kotlin compiler
# avoids spawning/tearing down a Kotlin daemon on every ephemeral container run.
kotlin.compiler.execution.strategy=in-process
